<script src="js/admin.js"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var editId = params.get('id');
  var existing = null;

  var ratingGroup = document.getElementById('rating-group');
  var sourceGroup = document.getElementById('source-group');
  AdminUI.initChipToggleGroup(ratingGroup, { multi: false });
  AdminUI.initChipToggleGroup(sourceGroup, { multi: false });

  if (editId) {
    AdminStore.getById('reviews', editId).then(function (rec) {
      existing = rec;
      if (!existing) return;
      document.getElementById('form-title').textContent = 'Edit Review';
      document.title = 'Edit Review | Diani Bikes Admin';
      document.getElementById('f-reviewer').value = existing.reviewer;
      document.getElementById('f-quote').value = existing.quote;
      AdminUI.setActiveChips(ratingGroup, [String(existing.rating)]);
      AdminUI.setActiveChips(sourceGroup, [existing.source]);
    });
  }

  AdminUI.initInlineValidation(document.getElementById('review-form'));
  document.getElementById('review-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var reviewer = document.getElementById('f-reviewer').value.trim();
    var quote = document.getElementById('f-quote').value.trim();
    if (!reviewer || !quote) {
      AdminUI.toast('Please enter a reviewer name and quote');
      return;
    }
    var record = {
      id: existing ? existing.id : null,
      reviewer: reviewer,
      quote: quote,
      rating: parseInt(AdminUI.getActiveChips(ratingGroup)[0] || '5', 10),
      source: AdminUI.getActiveChips(sourceGroup)[0] || 'TripAdvisor'
    };
    AdminStore.upsert('reviews', record).then(function () {
      AdminUI.toast('Review saved');
      setTimeout(function () { window.location.href = 'reviews.html'; }, 500);
    }).catch(AdminUI.showError);
  });
</script>
