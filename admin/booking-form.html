        <a href="bookings.html" class="btn btn-outline btn-sm">Cancel</a>

    <main class="admin-content">
      <form id="booking-add-form" novalidate>
        <div class="form-card" style="max-width:640px;">
          <h3>Booking Type</h3>
          <div class="chip-toggle-group" id="type-group">
            <button type="button" class="chip-toggle active" data-value="rental">Bike Rental</button>
            <button type="button" class="chip-toggle" data-value="tour">Tour / Excursion</button>
          </div>

          <div class="form-grid" style="margin-top:1.25rem;">
            <div class="form-row-2">
              <div class="form-field">
                <label for="f-name">Full Name</label>
                <input type="text" id="f-name" placeholder="Jane Doe" required>
              </div>
              <div class="form-field">
                <label for="f-email">Email Address</label>
                <input type="email" id="f-email" placeholder="jane@example.com">
              </div>
            </div>
            <div class="form-row-2">
              <div class="form-field">
                <label for="f-whatsapp">WhatsApp Number</label>
                <input type="tel" id="f-whatsapp" placeholder="+254 7XX XXX XXX">
              </div>
              <div class="form-field">
                <label for="f-date">Date</label>
                <input type="date" id="f-date" required>
              </div>
            </div>

            <div id="rental-fields">
              <div class="form-field">
                <label for="f-office">Office</label>
                <select id="f-office">
                  <option value="Diani Bazaar">Diani Bazaar</option>
                  <option value="Watamu (Jiweleupe)">Watamu (Jiweleupe)</option>
                </select>
              </div>
              <div class="form-field">
                <label>Bike Types &amp; Quantity</label>
                <div class="bike-qty-list">
                  <div class="bike-qty-row"><label for="f-qty-electric">Electric Bike</label><input type="number" id="f-qty-electric" min="0" value="0"></div>
                  <div class="bike-qty-row"><label for="f-qty-mountain">Mountain Bike</label><input type="number" id="f-qty-mountain" min="0" value="0"></div>
                  <div class="bike-qty-row"><label for="f-qty-manual">Manual Bike</label><input type="number" id="f-qty-manual" min="0" value="0"></div>
                  <div class="bike-qty-row"><label for="f-qty-kids">Kids Bike</label><input type="number" id="f-qty-kids" min="0" value="0"></div>
                </div>
              </div>
              <div class="form-field">
                <label for="f-duration">Rental Length</label>
                <select id="f-duration">
                  <option value="Half Day">Half Day</option>
                  <option value="Full Day">Full Day</option>
                </select>
              </div>
            </div>

            <div id="tour-fields" style="display:none;">
              <div class="form-field">
                <label for="f-tour">Tour / Excursion</label>
                <select id="f-tour"></select>
              </div>
              <div class="form-field">
                <label for="f-guests">Number of Guests</label>
                <input type="number" id="f-guests" min="1" value="2">
              </div>
            </div>

            <div class="form-row-2">
              <div class="form-field">
                <label>Payment Status</label>
                <div class="chip-toggle-group" id="payment-group">
                  <button type="button" class="chip-toggle active" data-value="Not Paid">Not Paid</button>
                  <button type="button" class="chip-toggle" data-value="Paid Deposit">Paid Deposit</button>
                  <button type="button" class="chip-toggle" data-value="Paid in Full">Paid in Full</button>
                </div>
              </div>
              <div class="form-field">
                <label>Booking Status</label>
                <div class="chip-toggle-group" id="bstatus-group">
                  <button type="button" class="chip-toggle active" data-value="New">New</button>
                  <button type="button" class="chip-toggle" data-value="Contacted">Contacted</button>
                  <button type="button" class="chip-toggle" data-value="Confirmed">Confirmed</button>
                </div>
              </div>
            </div>
          </div>

          <div class="form-actions-bar">
            <button type="submit" class="btn btn-primary">Save Booking</button>
          </div>
        </div>
      </form>

<script src="js/admin.js"></script>
<script>
  var typeGroup = document.getElementById('type-group');
  var paymentGroup = document.getElementById('payment-group');
  var bstatusGroup = document.getElementById('bstatus-group');
  AdminUI.initChipToggleGroup(typeGroup, { multi: false });
  AdminUI.initChipToggleGroup(paymentGroup, { multi: false });
  AdminUI.initChipToggleGroup(bstatusGroup, { multi: false });

  var rentalFields = document.getElementById('rental-fields');
  var tourFields = document.getElementById('tour-fields');
  var tourSelect = document.getElementById('f-tour');

  AdminStore.getAll('tours').then(function (tours) {
    tours.sort(function (a, b) { return a.title.localeCompare(b.title); }).forEach(function (t) {
      var opt = document.createElement('option');
      opt.value = t.title;
      opt.textContent = t.title;
      tourSelect.appendChild(opt);
    });
  });

  typeGroup.addEventListener('click', function () {
    var type = AdminUI.getActiveChips(typeGroup)[0];
    rentalFields.style.display = type === 'tour' ? 'none' : '';
    tourFields.style.display = type === 'tour' ? '' : 'none';
  });

  AdminUI.initInlineValidation(document.getElementById('booking-add-form'));
  document.getElementById('booking-add-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('f-name').value.trim();
    var date = document.getElementById('f-date').value;
    if (!name || !date) {
      AdminUI.toast('Please enter a name and date');
      return;
    }
    var type = AdminUI.getActiveChips(typeGroup)[0] || 'rental';

    var record = {
      type: type,
      name: name,
      email: document.getElementById('f-email').value.trim(),
      whatsapp: document.getElementById('f-whatsapp').value.trim(),
      date: date,
      submittedAt: new Date().toISOString(),
      status: AdminUI.getActiveChips(bstatusGroup)[0] || 'New',
      paymentStatus: AdminUI.getActiveChips(paymentGroup)[0] || 'Not Paid'
    };

    if (type === 'rental') {
      record.interest = 'Bike Rental';
      record.office = document.getElementById('f-office').value;
      record.duration = document.getElementById('f-duration').value;
      record.bikes = {
        'Electric Bike': parseInt(document.getElementById('f-qty-electric').value, 10) || 0,
        'Mountain Bike': parseInt(document.getElementById('f-qty-mountain').value, 10) || 0,
        'Manual Bike': parseInt(document.getElementById('f-qty-manual').value, 10) || 0,
        'Kids Bike': parseInt(document.getElementById('f-qty-kids').value, 10) || 0
      };
    } else {
      record.interest = tourSelect.value || 'Tour Booking';
      record.guests = parseInt(document.getElementById('f-guests').value, 10) || null;
    }

    AdminStore.upsert('bookings', record).then(function () {
      AdminUI.toast('Booking added');
      setTimeout(function () { window.location.href = 'bookings.html'; }, 500);
    }).catch(AdminUI.showError);
  });
</script>
