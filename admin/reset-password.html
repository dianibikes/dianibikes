<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Diani Bikes</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
<style>
  body { background: var(--color-charcoal); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .login-card { background: var(--color-white); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 2.25rem 2rem; width: 100%; max-width: 380px; }
  .login-logo { display: flex; justify-content: center; margin-bottom: 1.25rem; }
  .login-logo img { height: 52px; width: auto; }
  .login-card h1 { font-size: 1.3rem; text-align: center; margin-bottom: 0.35rem; }
  .login-card .sub { text-align: center; color: var(--color-charcoal-soft); font-size: 0.88rem; margin-bottom: 1.5rem; }
  .login-error { display: none; background: rgba(232,57,124,0.1); color: var(--color-pink); font-size: 0.85rem; font-weight: 600; padding: 0.7em 1em; border-radius: var(--radius-sm); margin-bottom: 1rem; text-align: center; }
  .login-error.is-open { display: block; }
  .field-hint { font-size: 0.78rem; color: var(--color-charcoal-soft); margin-top: -0.2rem; }
  .login-back { display: block; text-align: center; margin-top: 1.4rem; font-size: 0.85rem; color: var(--color-blue); font-weight: 700; }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-logo"><img src="../images/logo.svg" alt="Diani Bikes"></div>
  <h1 id="page-title">Set a New Password</h1>
  <p class="sub" id="page-sub">Choose a new password for your admin account.</p>

  <div class="login-error" id="reset-error"></div>

  <form id="reset-form" class="form-grid">
    <div class="form-field">
      <label for="new-password">New password</label>
      <input type="password" id="new-password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8">
      <span class="field-hint">Minimum 8 characters.</span>
    </div>
    <div class="form-field">
      <label for="confirm-password">Confirm new password</label>
      <input type="password" id="confirm-password" name="confirm" placeholder="Re-enter password" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Set Password</button>
  </form>

  <a href="login.html" class="login-back">&larr; Back to Login</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  var form = document.getElementById('reset-form');
  var passwordInput = document.getElementById('new-password');
  var confirmInput = document.getElementById('confirm-password');
  var errorEl = document.getElementById('reset-error');
  var submitBtn = document.getElementById('reset-submit');

  function showError(message) {
    errorEl.textContent = message;
    errorEl.classList.add('is-open');
  }

  // Supabase's password-reset email links land here with a recovery token in
  // the URL; the client library exchanges it for a session automatically.
  window.sb.auth.onAuthStateChange(function (event) {
    if (event !== 'PASSWORD_RECOVERY') return;
  });

  window.sb.auth.getSession().then(function (result) {
    // The recovery token arrives in the URL fragment and has already been
    // exchanged for a session by now. Strip it so it stops showing in the
    // address bar and is not left sitting in browser history.
    if (window.location.hash && window.history.replaceState) {
      window.history.replaceState(null, '', window.location.pathname);
    }
    if (!result.data || !result.data.session) {
      document.getElementById('page-title').textContent = 'Reset Link Invalid or Expired';
      document.getElementById('page-sub').textContent = 'Request a new one from the login page.';
      form.style.display = 'none';
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorEl.classList.remove('is-open');

    if (passwordInput.value.length < 8) {
      showError('Password must be at least 8 characters.');
      passwordInput.focus();
      return;
    }
    if (passwordInput.value !== confirmInput.value) {
      showError('Passwords do not match.');
      confirmInput.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving…';

    window.sb.auth.updateUser({ password: passwordInput.value }).then(function (result) {
      if (result.error) {
        showError(result.error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Set Password';
        return;
      }
      window.location.href = 'index.html';
    }).catch(function () {
      showError('Could not reach the sign-in service. Check your connection and try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Set Password';
    });
  });
</script>
</body>
</html>
